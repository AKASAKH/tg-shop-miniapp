<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TG Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #000000);
            --hint: var(--tg-theme-hint-color, #999999);
            --link: var(--tg-theme-link-color, #2481cc);
            --btn: var(--tg-theme-button-color, #2481cc);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 80px; /* Space for MainButton */
        }

        header {
            padding: 16px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid var(--secondary-bg);
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 10;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 16px;
        }

        .product-card {
            background: var(--secondary-bg);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            transition: transform 0.2s;
        }
        .product-card:active { transform: scale(0.95); }

        .product-emoji {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .product-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .product-price {
            font-size: 16px;
            font-weight: bold;
            color: var(--link);
            margin-bottom: 8px;
        }

        .add-btn {
            background: var(--btn);
            color: var(--btn-text);
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        /* Cart Summary Bar (Optional visual indicator) */
        .cart-summary {
            position: fixed;
            bottom: 60px;
            left: 0;
            right: 0;
            background: var(--secondary-bg);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            border-top: 1px solid var(--bg);
            display: none; /* Hidden by default, shown via JS */
        }
    </style>
</head>
<body>

    <header>🛍️ Telegram Gadget Shop</header>

    <div class="products-grid" id="productsGrid">
        <!-- Products will be injected here by JS -->
    </div>

    <script>
        // 1. Initialize Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // 2. Mock Product Data
        const products = [
            { id: 1, name: "Wireless Earbuds", price: 49.99, emoji: "🎧" },
            { id: 2, name: "Smart Watch", price: 129.00, emoji: "⌚" },
            { id: 3, name: "Phone Case", price: 15.50, emoji: "📱" },
            { id: 4, name: "Power Bank", price: 25.00, emoji: "🔋" },
            { id: 5, name: "Mech Keyboard", price: 89.99, emoji: "⌨️" },
            { id: 6, name: "Webcam HD", price: 55.00, emoji: "📷" }
        ];

        let cart = [];

        // 3. Render Products
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="product-emoji">${p.emoji}</div>
                    <div class="product-name">${p.name}</div>
                    <div class="product-price">$${p.price.toFixed(2)}</div>
                    <button class="add-btn" onclick="addToCart(${p.id})">Add to Cart</button>
                </div>
            `).join('');
        }

        // 4. Cart Logic
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }

            // Telegram Haptic Feedback (Vibration)
            tg.HapticFeedback.impactOccurred('light');
            
            updateCheckoutButton();
        }

        function getTotal() {
            return cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        }

        function getTotalItems() {
            return cart.reduce((sum, item) => sum + item.qty, 0);
        }

        // 5. Telegram Main Button (Checkout)
        function updateCheckoutButton() {
            const totalItems = getTotalItems();
            const total = getTotal();

            if (totalItems > 0) {
                tg.MainButton.setText(`Checkout • $${total.toFixed(2)} (${totalItems} items)`);
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        // 6. Handle Checkout Click
        tg.MainButton.onClick(() => {
            if (cart.length === 0) return;

            // Prepare order data
            const orderData = {
                action: "checkout",
                user: {
                    id: tg.initDataUnsafe.user?.id,
                    name: `${tg.initDataUnsafe.user?.first_name || ''} ${tg.initDataUnsafe.user?.last_name || ''}`.trim(),
                    username: tg.initDataUnsafe.user?.username
                },
                items: cart.map(item => ({ id: item.id, name: item.name, qty: item.qty, price: item.price })),
                total: getTotal()
            };

            // Haptic feedback for success
            tg.HapticFeedback.notificationOccurred('success');

            // Send data to the Telegram Bot backend
            tg.sendData(JSON.stringify(orderData));
            
            // Optional: Show loading or close app
            tg.MainButton.showProgress(true);
            setTimeout(() => {
                tg.close(); // Closes the mini app after sending
            }, 1500);
        });

        // Initialize
        renderProducts();
        updateCheckoutButton();
    </script>
</body>
</html>

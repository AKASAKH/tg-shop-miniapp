<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mininize Studio - Store & Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body, button, a, img, input { touch-action: manipulation; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#fff0f3', 100: '#ffccd5', 500: '#a4133c', 600: '#800f2f', 700: '#590d22' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col justify-between pb-24 select-none">

    <!-- PROMOTIONAL POPUP BANNER -->
    <div id="promo-popup" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 transition-opacity duration-300">
        <div class="bg-white text-gray-900 rounded-2xl max-w-xs w-full p-5 space-y-3 shadow-xl relative text-center border border-gray-100">
            <button onclick="closePromoPopup()" class="absolute top-2.5 right-2.5 text-gray-400 hover:text-gray-600 w-7 h-7 bg-gray-50 rounded-full flex items-center justify-center text-xs">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="w-10 h-10 bg-pink-50 text-[#a4133c] rounded-full flex items-center justify-center mx-auto text-base"><i class="fa-solid fa-tag"></i></div>
            <div>
                <span class="bg-pink-50 text-[#a4133c] text-[9px] uppercase font-bold px-2.5 py-0.5 rounded-md">Grand Opening Special</span>
                <h3 class="text-sm font-bold mt-1 text-gray-900">Get 15% OFF Your First Order!</h3>
                <p class="text-[11px] text-gray-500 mt-0.5">Use code <span class="font-bold text-gray-800 underline">MININIZE15</span> at checkout.</p>
            </div>
            <button onclick="closePromoPopup()" class="w-full bg-[#800f2f] text-white font-bold text-xs py-2.5 min-h-[44px] rounded-xl shadow-xs active:scale-95 transition-transform">Shop Collection ✨</button>
        </div>
    </div>

    <!-- HEADER -->
    <header class="bg-white border-b border-gray-100 sticky top-0 z-40 shadow-xs">
        <div class="max-w-6xl mx-auto px-4 py-2 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div style="display: inline-flex; align-items: center; background: #fff0f3; padding: 6px 14px; border-radius: 99px; border: 1px solid #ffccd5; box-shadow: 0 2px 8px rgba(255, 182, 193, 0.25);">
                    <div style="width: 28px; height: 28px; border-radius: 50%; background: #ffb3c1; display: flex; align-items: center; justify-content: center; color: #800f2f; font-weight: bold; font-size: 11px; margin-right: 9px;">🎀</div>
                    <div style="text-align: left; line-height: 1.1;">
                        <span style="font-family: serif; font-weight: bold; font-size: 12px; letter-spacing: 1.5px; color: #590d22; display: block;">MININIZE</span>
                        <span style="font-family: sans-serif; font-size: 7.5px; font-weight: 600; letter-spacing: 2px; color: #a4133c; display: block;">STUDIO</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <!-- CURRENCY SELECTOR -->
                <select id="currency-select" onchange="changeCurrency(this.value)" class="text-[11px] bg-gray-50 border border-gray-200 rounded-lg px-2 py-1 font-medium focus:outline-none focus:border-[#a4133c]">
                    <option value="USD">USD ($)</option>
                    <option value="KHR">KHR (៛)</option>
                </select>
                <div class="flex items-center space-x-1.5">
                    <span class="flex h-1.5 w-1.5 relative">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-500"></span>
                    </span>
                    <span class="text-[11px] font-medium text-gray-500" id="session-user-badge">Guest Mode</span>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full">

        <!-- CUSTOMER STOREFRONT VIEW -->
        <div id="customer-view" class="space-y-4">
            <div id="page-shop" class="space-y-3">
                
                <!-- PERSONALIZED MEMBER GREETING BANNER -->
                <div id="user-greeting-banner" class="hidden bg-pink-50/80 p-3 rounded-2xl border border-pink-100 flex items-center justify-between text-xs shadow-xs">
                    <div>
                        <span class="font-bold text-[#a4133c]" id="welcome-user-name">Welcome back, Shopper! ✨</span>
                        <p class="text-[10px] text-gray-500">Exclusive aesthetic drops curated for you.</p>
                    </div>
                    <span class="text-[10px] font-mono font-bold bg-white px-2.5 py-1 rounded-xl text-[#a4133c] shadow-xs border border-pink-100" id="welcome-user-id">USR-000</span>
                </div>

                <div class="relative max-w-md mx-auto">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i class="fa-solid fa-magnifying-glass text-[11px]"></i></span>
                    <input type="text" id="search-input" oninput="filterProducts()" placeholder="Search aesthetic pieces..." class="w-full pl-8 pr-3 py-2 bg-white border border-gray-200 rounded-xl text-xs shadow-xs focus:outline-none focus:border-[#a4133c]">
                </div>
                
                <!-- CATEGORY FILTER BAR -->
                <div class="flex space-x-1.5 overflow-x-auto pb-1 text-[11px] scrollbar-none justify-start md:justify-center">
                    <button onclick="filterCategory('All')" class="cat-btn bg-[#800f2f] text-white px-3 py-1.5 rounded-full font-medium whitespace-nowrap shadow-xs min-h-[36px]">All ✨</button>
                    <button onclick="filterCategory('Hairpins')" class="cat-btn bg-white text-gray-600 border border-gray-200 px-3 py-1.5 rounded-full font-medium whitespace-nowrap min-h-[36px]">Hairpins 🎀</button>
                    <button onclick="filterCategory('Necklaces')" class="cat-btn bg-white text-gray-600 border border-gray-200 px-3 py-1.5 rounded-full font-medium whitespace-nowrap min-h-[36px]">Necklaces 📿</button>
                    <button onclick="filterCategory('Rings')" class="cat-btn bg-white text-gray-600 border border-gray-200 px-3 py-1.5 rounded-full font-medium whitespace-nowrap min-h-[36px]">Rings 💍</button>
                    <button onclick="filterCategory('Earrings')" class="cat-btn bg-white text-gray-600 border border-gray-200 px-3 py-1.5 rounded-full font-medium whitespace-nowrap min-h-[36px]">Earrings 💎</button>
                    <button onclick="filterCategory('Phone Charms')" class="cat-btn bg-white text-gray-600 border border-gray-200 px-3 py-1.5 rounded-full font-medium whitespace-nowrap min-h-[36px]">Phone Charms 📱</button>
                    <button onclick="filterCategory('Bags & Pouches')" class="cat-btn bg-white text-gray-600 border border-gray-200 px-3 py-1.5 rounded-full font-medium whitespace-nowrap min-h-[36px]">Bags & Pouches 👜</button>
                </div>

                <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
            </div>

            <!-- WISHLIST -->
            <div id="page-wishlist" class="hidden space-y-3 max-w-2xl mx-auto">
                <h3 class="font-serif italic font-bold text-xs text-gray-900 uppercase tracking-wide">Cloud Saved Favorite Items 💖</h3>
                <div id="wishlist-grid" class="grid grid-cols-2 md:grid-cols-3 gap-3"></div>
            </div>

            <!-- PROFILE
